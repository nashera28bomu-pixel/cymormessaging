name: Extract Zip
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and flatten
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          [ -z "$ZIP_FILE" ] && { echo "No zip found"; exit 1; }
          unzip -o "$ZIP_FILE" -d extracted_tmp
          TOPDIR=$(find extracted_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$TOPDIR"/* "$TOPDIR"/.[!.]* . 2>/dev/null || true
          rm -rf extracted_tmp "$ZIP_FILE"
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract uploaded zip" || echo "Nothing to commit"
          git push
