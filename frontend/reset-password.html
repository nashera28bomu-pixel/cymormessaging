<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password — Cymor Messaging</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="logo">Cymor Messaging</div>
    <h1>Set a new password</h1>
    <div class="auth-error" id="error"></div>
    <div id="success" style="display:none; text-align:center;"><p>Password updated. You can now <a href="login.html">log in</a>.</p></div>

    <form id="reset-form">
      <div class="field">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" type="submit" id="submit-btn">Update password</button>
    </form>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("error");
  if (!token) {
    errorBox.textContent = "This reset link is missing its token. Request a new one.";
    errorBox.classList.add("visible");
    return;
  }
  try {
    await CymorAPI.request("/auth/reset-password", {
      method: "POST",
      auth: false,
      org: false,
      body: { token, newPassword: document.getElementById("newPassword").value },
    });
    document.getElementById("reset-form").style.display = "none";
    document.getElementById("success").style.display = "block";
  } catch (err) {
    errorBox.textContent = err.message || "This link may have expired.";
    errorBox.classList.add("visible");
  }
});
</script>
</body>
</html>
