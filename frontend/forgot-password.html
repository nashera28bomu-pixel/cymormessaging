<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Cymor Messaging</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="logo">Cymor Messaging</div>
    <h1>Reset your password</h1>
    <p class="sub">We'll email you a reset link</p>

    <div id="success" style="display:none; text-align:center;"><p>If that email exists, a reset link is on its way.</p></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>
      <button class="btn btn-primary" type="submit" id="submit-btn">Send reset link</button>
    </form>

    <div class="switch"><a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("submit-btn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";
  try {
    await CymorAPI.request("/auth/forgot-password", { method: "POST", auth: false, org: false, body: { email: document.getElementById("email").value } });
  } catch (err) { /* endpoint always responds the same way, regardless of outcome */ }
  document.getElementById("forgot-form").style.display = "none";
  document.getElementById("success").style.display = "block";
});
</script>
</body>
</html>
